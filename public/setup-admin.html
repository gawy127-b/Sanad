<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء مدير سَنَد</title><style>body{margin:0;background:#f7f1e9;font:16px Tahoma,Arial;color:#351522}.card{max-width:520px;margin:7vh auto;background:#fff;padding:26px;border-radius:18px;box-shadow:0 12px 35px #35152218}h1{color:#641c32}label{display:block;margin:14px 0 6px;color:#641c32;font-weight:bold}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddcdd0;border-radius:9px;font:inherit}button{margin-top:18px;padding:12px 20px;border:0;border-radius:9px;background:#641c32;color:white;font:700 16px Tahoma;width:100%}.muted{color:#806e72;line-height:1.8}.error{color:#a3213e}.ok{color:#167647}</style></head><body><main class="card"><h1>إنشاء حساب مدير سَنَد</h1><p class="muted">هذه الخطوة تُستخدم مرة واحدة فقط بعد إعداد قاعدة البيانات ومفتاح ADMIN_SETUP_KEY في Cloudflare. احتفظ بكلمة المرور في مكان آمن.</p><form id="f"><label>مفتاح إعداد المدير</label><input name="setupKey" type="password" required><label>اسم المدير</label><input name="name" required minlength="2"><label>البريد الإلكتروني</label><input name="email" type="email" required><label>كلمة المرور (12 حرفًا على الأقل)</label><input name="password" type="password" required minlength="12"><button>إنشاء حساب المدير</button><div id="m"></div></form></main><script>document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const m=document.querySelector('#m');m.textContent='جارٍ الإنشاء...';try{const r=await fetch('/api/admin/setup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر إنشاء الحساب');m.className='ok';m.textContent='تم إنشاء حساب المدير. جاري فتح لوحة الإدارة...';setTimeout(()=>location.href='/admin.html',700)}catch(x){m.className='error';m.textContent=x.message}}</script></body></html>
