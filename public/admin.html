<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#641c32"><title>إدارة سَنَد</title><style>
:root{--b:#641c32;--d:#351522;--g:#a77a32;--bg:#f7f1e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--d);font:16px Tahoma,Arial,sans-serif}.top{background:linear-gradient(120deg,var(--d),var(--b));color:#fff;padding:22px max(18px,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.top h1{margin:0;color:#f0d49d}.top a{color:#fff}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid #eadfe0;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 8px 24px #3515220b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.stat{padding:18px;border-radius:14px;background:#fbf7f1;text-align:center}.stat b{display:block;font-size:2rem;color:var(--b)}label{display:block;font-weight:700;color:var(--b);margin:10px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #ddcdd0;border-radius:10px;font:inherit;background:#fff}textarea{min-height:76px;resize:vertical}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--b);color:white;font:700 15px Tahoma;cursor:pointer;margin:8px 4px 0 0}.btn.gold{background:var(--g)}.btn.light{background:#eee5e3;color:var(--d)}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{background:#eee5e3;color:var(--b)}.tab.active{background:var(--b);color:#fff}.item{border-bottom:1px solid #eee5e3;padding:12px 2px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.muted{color:#806e72;font-size:.9rem}.hidden{display:none!important}.error{color:#a3213e;margin:10px 0}.success{color:#167647;margin:10px 0}h2{color:var(--b)}#app{display:none}@media(max-width:600px){.top{padding:18px}.wrap{margin:12px auto}}
</style></head><body><header class="top"><div><h1>لوحة إدارة سَنَد</h1><div>إدارة المحتوى والطلاب والمسابقات</div></div><div><a href="/">العودة للموقع</a>　<button class="btn light" id="logout">خروج</button></div></header><main class="wrap">
<section id="login" class="card"><h2>دخول المدير</h2><p class="muted">استخدم حساب المدير الذي أنشأته في إعداد المنصة.</p><form id="loginForm"><label>البريد الإلكتروني</label><input name="email" type="email" required><label>كلمة المرور</label><input name="password" type="password" required><button class="btn">دخول</button><div id="loginMsg" class="error"></div></form></section>
<section id="app"><div class="grid" id="stats"></div><section class="card"><div class="tabs"><button class="btn tab active" data-tab="resources">المذكرات والشرح</button><button class="btn tab" data-tab="questions">الامتحانات والأسئلة</button><button class="btn tab" data-tab="contests">المسابقات</button><button class="btn tab" data-tab="users">الطلاب</button></div></section>
<section class="card" id="resourcesPane"><h2>إضافة مورد تعليمي</h2><form id="resourceForm"><div class="row"><div><label>المرحلة</label><select name="track"><option value="both">المرحلتان</option><option value="thanaweya">تالتة ثانوي</option><option value="bac2">تانية بكالوريا</option></select></div><div><label>المادة</label><input name="subject" required placeholder="مثال: اللغة العربية"></div><div><label>نوع المحتوى</label><select name="kind"><option>ملخص</option><option>شرح</option><option>مراجعة</option><option>فيديو</option><option>ملف PDF</option></select></div></div><label>عنوان المحتوى</label><input name="title" required><label>وصف مختصر</label><textarea name="description"></textarea><label>اختيار ملف من الموبايل (صورة أو فيديو أو PDF)</label><input name="file" type="file" accept="image/*,video/*,application/pdf" required><button class="btn">حفظ المحتوى</button></form><div id="resourceList"></div></section>
<section class="card hidden" id="questionsPane"><h2>إضافة سؤال امتحان</h2><form id="questionForm"><div class="row"><div><label>المرحلة</label><select name="track"><option value="both">المرحلتان</option><option value="thanaweya">تالتة ثانوي</option><option value="bac2">تانية بكالوريا</option></select></div><div><label>المادة</label><input name="subject" required></div></div><label>نص السؤال</label><textarea name="prompt" required></textarea><div class="row"><div><label>الاختيار الأول</label><input name="o0" required></div><div><label>الاختيار الثاني</label><input name="o1" required></div><div><label>الاختيار الثالث</label><input name="o2"></div><div><label>الاختيار الرابع</label><input name="o3"></div></div><label>رقم الإجابة الصحيحة</label><select name="correct_index"><option value="0">الأول</option><option value="1">الثاني</option><option value="2">الثالث</option><option value="3">الرابع</option></select><label>تفسير الإجابة (اختياري)</label><textarea name="explanation"></textarea><button class="btn">إضافة السؤال</button></form><div id="questionList"></div></section>
<section class="card hidden" id="contestsPane"><h2>إنشاء مسابقة</h2><form id="contestForm"><label>اسم المسابقة</label><input name="title" required><label>الوصف</label><textarea name="description"></textarea><div class="row"><div><label>المرحلة</label><select name="track"><option value="both">المرحلتان</option><option value="thanaweya">تالتة ثانوي</option><option value="bac2">تانية بكالوريا</option></select></div><div><label>تاريخ البداية</label><input name="starts_at" type="date"></div><div><label>تاريخ النهاية</label><input name="ends_at" type="date"></div></div><button class="btn">إنشاء المسابقة</button></form><div id="contestList"></div></section>
<section class="card hidden" id="usersPane"><h2>الطلاب المسجلون</h2><div id="userList"></div></section><div id="message"></div></section></main><script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',headers:{'content-type':'application/json',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'حدث خطأ');return d}function msg(s,ok=false){$('#message').className=ok?'success':'error';$('#message').textContent=s;setTimeout(()=>$('#message').textContent='',4000)}function formData(f){return Object.fromEntries(new FormData(f))}
async function start(){try{const d=await api('/api/auth/me');if(d.user.role!=='admin')throw Error('الحساب ليس حساب مدير');$('#login').classList.add('hidden');$('#app').style.display='block';await loadAll()}catch(e){$('#login').classList.remove('hidden');$('#app').style.display='none'}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/login',{method:'POST',body:JSON.stringify(formData(e.target))});await start()}catch(x){$('#loginMsg').textContent=x.message}};
$('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.href='/'};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['resources','questions','contests','users'].forEach(k=>$('#'+k+'Pane').classList.toggle('hidden',k!==b.dataset.tab))});
async function loadAll(){const s=await api('/api/admin/overview');$('#stats').innerHTML=[['الطلاب',s.users],['المحتوى',s.resources],['الأسئلة',s.questions]].map(x=>`<div class="stat"><b>${x[1]}</b>${x[0]}</div>`).join('');await Promise.all([loadResources(),loadQuestions(),loadContests(),loadUsers()])}
async function loadResources(){const d=await api('/api/admin/resources');$('#resourceList').innerHTML='<h2>المحتوى المنشور</h2>'+d.items.map(x=>`<div class="item"><span><b>${esc(x.title)}</b><div class="muted">${esc(x.subject)} · ${esc(x.track)}</div></span><button class="btn light" data-del-resource="${x.id}">حذف</button></div>`).join('')}
$('#resourceForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/resources',{method:'POST',body:JSON.stringify(formData(e.target))});e.target.reset();await loadResources();msg('تم حفظ المحتوى.',true)}catch(x){msg(x.message)}};
$('#resourceList').onclick=async e=>{const b=e.target.closest('[data-del-resource]');if(b&&confirm('حذف هذا المحتوى؟')){await api('/api/admin/resources/'+b.dataset.delResource,{method:'DELETE'});loadResources()}};
async function loadQuestions(){const d=await api('/api/admin/questions');$('#questionList').innerHTML='<h2>الأسئلة الحالية</h2>'+d.items.map(x=>`<div class="item"><span><b>${esc(x.prompt)}</b><div class="muted">${esc(x.subject)} · ${esc(x.track)}</div></span><button class="btn light" data-del-question="${x.id}">حذف</button></div>`).join('')}
$('#questionForm').onsubmit=async e=>{e.preventDefault();const f=formData(e.target),options=[f.o0,f.o1,f.o2,f.o3].filter(Boolean);if(Number(f.correct_index)>=options.length){msg('الإجابة الصحيحة لا تطابق الاختيارات');return}try{await api('/api/admin/questions',{method:'POST',body:JSON.stringify({...f,options,correct_index:Number(f.correct_index)})});e.target.reset();await loadQuestions();msg('تمت إضافة السؤال.',true)}catch(x){msg(x.message)}};
$('#questionList').onclick=async e=>{const b=e.target.closest('[data-del-question]');if(b&&confirm('حذف السؤال؟')){await api('/api/admin/questions/'+b.dataset.delQuestion,{method:'DELETE'});loadQuestions()}};
async function loadContests(){const d=await api('/api/admin/contests');$('#contestList').innerHTML='<h2>المسابقات</h2>'+d.items.map(x=>`<div class="item"><span><b>${esc(x.title)}</b><div class="muted">${esc(x.track)} · ${esc(x.starts_at||'') } ${esc(x.ends_at||'')}</div></span><button class="btn light" data-del-contest="${x.id}">حذف</button></div>`).join('')}
$('#contestForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/contests',{method:'POST',body:JSON.stringify(formData(e.target))});e.target.reset();await loadContests();msg('تم إنشاء المسابقة.',true)}catch(x){msg(x.message)}};
$('#contestList').onclick=async e=>{const b=e.target.closest('[data-del-contest]');if(b&&confirm('حذف المسابقة؟')){await api('/api/admin/contests/'+b.dataset.delContest,{method:'DELETE'});loadContests()}};
async function loadUsers(){const d=await api('/api/admin/users');$('#userList').innerHTML=d.items.map(x=>`<div class="item"><span><b>${esc(x.name)}</b><div class="muted">${esc(x.email)} · ${x.track==='thanaweya'?'تالتة ثانوي':'تانية بكالوريا'}</div></span></div>`).join('')||'<p>لا يوجد طلاب حتى الآن.</p>'}
start();</script></body></html>
